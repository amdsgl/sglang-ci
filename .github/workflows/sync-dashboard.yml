name: Sync Dashboard

on:
  push:
    branches: [main]
  # GitHub queues scheduled runs on a best-effort basis and drops them outright
  # under load: the first two hourly ticks after this workflow was added never
  # fired, and the source dashboard's own hourly schedule arrives anywhere from
  # one to fifty-five minutes late. So poll rather than aiming for a fixed
  # window after the source refresh, and keep the interval short enough that a
  # dropped tick costs minutes instead of hours. A poll with nothing to do
  # fetches one 44 KB manifest and stops.
  schedule:
    - cron: '*/15 * * * *'
  # ROCm/sglang-ci dispatches this the moment it finishes deploying, which is
  # what actually keeps this mirror current: a dispatch is not subject to the
  # scheduler throttling that reduces the cron above to roughly five fires a
  # day. The cron stays as the fallback for every way a dispatch can fail to
  # arrive -- no token configured on the source, a failed source run, a
  # dropped delivery -- so losing it costs latency, never correctness.
  #
  # A workflow_dispatch rather than a repository_dispatch because of what each
  # asks of the source's token. A repository_dispatch needs Contents: write,
  # which can push to main, and Pages here builds from main, so that token
  # could publish anything. This needs only Actions: write, which can start a
  # run but not change what it publishes.
  workflow_dispatch:
    inputs:
      source_run:
        description: Source deploy run that sent this. Set by ROCm/sglang-ci; leave empty for a manual sync.
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Never cancel a deployment already in flight. A half-applied Pages
  # deployment is worse than a late one, and the next poll is minutes away.
  group: github-pages
  cancel-in-progress: false

env:
  # ROCm/sglang-ci is the upstream again now that it is unarchived. The fork it
  # was pointed at while the upstream was archived has no Actions minutes left,
  # so its Pages output is frozen and every poll here finds nothing to publish.
  SOURCE_DASHBOARD_URL: https://rocm.github.io/sglang-ci/

jobs:
  # Deciding whether there is anything to publish is separated from publishing
  # it so that a poll finding no change leaves no deployment record and never
  # touches the github-pages environment.
  check:
    runs-on: ubuntu-latest
    # Long enough for the dispatch poll below to run its full course.
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Compare source and mirror manifests
        id: compare
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          host="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]').github.io"
          if [ "$name" = "${host}" ]; then
            mirror_url="https://${host}/"
          else
            mirror_url="https://${host}/${name}/"
          fi
          echo "Source: ${SOURCE_DASHBOARD_URL}"
          echo "Mirror: ${mirror_url}"

          # The source dispatches the moment its deploy step returns, but Pages
          # needs a little longer to serve the new manifest at the edge. A
          # single fetch landing inside that window reads "already matches",
          # and this mirror would then sit until the next scheduled tick --
          # hours, at the cadence the cron really gets, which is the whole
          # problem the dispatch exists to fix. So a dispatch from the source
          # waits for the manifest it was promised; every other trigger, a
          # manual one included, keeps the single fetch it has always done,
          # because nothing told it to expect a change.
          if [ -n "${SOURCE_RUN}" ]; then
            echo "Dispatched by ${SOURCE_RUN}"
            attempts=20
          else
            attempts=1
          fi

          changed=false
          for attempt in $(seq 1 "$attempts"); do
            if [ "$attempt" -gt 1 ]; then
              sleep 15
            fi

            bust="?poll=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"

            # Not fatal while polling: a source read that fails on attempt 3 of
            # 20 is a blip, and failing the run over it would throw away the
            # dispatch this is here to honour.
            if ! curl --fail --silent --show-error --location \
                 --retry 4 --retry-all-errors \
                 "${SOURCE_DASHBOARD_URL}site-manifest.json${bust}" \
                 --output /tmp/source-manifest.json; then
              echo "Attempt ${attempt}/${attempts}: could not read the source manifest"
              if [ "$attempt" = "$attempts" ]; then
                echo "::error::Source manifest unreadable after ${attempts} attempts"
                exit 1
              fi
              continue
            fi

            # A mirror that has never deployed, or one whose manifest predates
            # this scheme, answers 404. Treat anything unreadable as "changed"
            # so the sync below is what decides, not this comparison.
            if curl --fail --silent --show-error --location \
                 "${mirror_url}site-manifest.json${bust}" \
                 --output /tmp/mirror-manifest.json; then
              if cmp --quiet /tmp/source-manifest.json /tmp/mirror-manifest.json; then
                echo "Attempt ${attempt}/${attempts}: mirror still matches the source"
                continue
              fi
              echo "Mirror manifest differs from the source"
            else
              echo "Mirror manifest is not published yet"
            fi

            changed=true
            break
          done

          if [ "$changed" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            if [ "$attempts" -gt 1 ]; then
              # Not an error. The usual cause is benign: a scheduled poll
              # already published this manifest before the dispatch landed.
              echo "::notice::No new manifest within ${attempts} attempts — already in sync, or the source deployed no change"
            else
              echo "::notice::Mirror already matches the source manifest — nothing to deploy"
            fi
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This repo was enabled with "Deploy from a branch", so a push to main
      # also starts GitHub's own legacy build, which would replace the artifact
      # deployed below. Prefer workflow mode, which removes the race entirely.
      # GitHub requires admin or the "manage Pages settings" permission for
      # this, which a collaborator token does not have, so treat a refusal as
      # expected and fall back to the ordering delay below.
      - name: Prefer workflow Pages publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo unknown)
          if [ "$current" = "workflow" ]; then
            echo "Pages already publishes from a workflow"
            exit 0
          fi
          if gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
               -f build_type=workflow >/dev/null 2>&1; then
            echo "Switched Pages to workflow publishing"
          else
            echo "::notice::Cannot switch Pages to workflow publishing (needs admin); relying on the ordering delay"
          fi

      - name: Wait for legacy branch deployment
        if: github.event_name == 'push'
        run: sleep 45

      # site_mirror.py is executable code fetched from another site. Verify it
      # against the SHA-256 in that site's manifest before running it.
      - name: Download verified mirror client
        run: |
          set -euo pipefail
          bust="?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-all-errors \
            "${SOURCE_DASHBOARD_URL}site-manifest.json${bust}" \
            --output /tmp/site-manifest.json
          curl --fail --silent --show-error --location \
            --retry 4 --retry-all-errors \
            "${SOURCE_DASHBOARD_URL}mirror/site_mirror.py${bust}" \
            --output /tmp/site_mirror.py
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("/tmp/site-manifest.json").read_bytes())
          expected = next(
              item for item in manifest["files"]
              if item["path"] == "mirror/site_mirror.py"
          )
          body = Path("/tmp/site_mirror.py").read_bytes()
          assert len(body) == expected["size"], "mirror client size mismatch"
          assert hashlib.sha256(body).hexdigest() == expected["sha256"], (
              "mirror client SHA-256 mismatch"
          )
          PY

      - name: Mirror source site
        run: |
          python3 /tmp/site_mirror.py sync \
            --source-url "$SOURCE_DASHBOARD_URL" \
            --output _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The */15 schedule above is not what this repo actually gets. Over the ten
  # days to 2026-10-09 it fired about five times a day instead of ninety-six,
  # at arbitrary minutes, leaving gaps of three to seven hours -- which is the
  # mirror's real staleness, not the poll interval. GitHub deprioritises
  # scheduled workflows in a public repository with no recent activity, and
  # disables them outright after sixty days of it; the last commit here was
  # 2026-08-17, so that cliff is days away.
  #
  # A commit is activity, whoever makes it, so one per poll resets the clock.
  # Scheduled runs themselves do not count.
  #
  # Three things this deliberately does not do:
  #   - commit to main, which is a trigger of this same workflow (a push by
  #     GITHUB_TOKEN does not start a run today, but a loop that is one
  #     settings change away from existing is not worth the saved branch);
  #   - keep history, since nothing reads it: the branch is rewritten to a
  #     single parentless commit each time and never grows;
  #   - fail the sync, hence continue-on-error -- a mirror that publishes is
  #     worth more than one that recorded a heartbeat.
  heartbeat:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Record repository activity
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: heartbeat
        run: |
          set -euo pipefail

          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          tree_sha="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq '.sha' <<JSON
          {"tree":[{"path":"HEARTBEAT","mode":"100644","type":"blob",
                    "content":"${stamp}\nKeeps this repository's scheduled workflows alive. Not read by anything.\n"}]}
          JSON
          )"

          commit_sha="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/git/commits" --jq '.sha' \
            -f message="heartbeat ${stamp}" \
            -f tree="${tree_sha}")"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
              -f sha="${commit_sha}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="${commit_sha}" >/dev/null
          fi

          echo "::notice::Heartbeat ${stamp} recorded on ${BRANCH} (${commit_sha})"
